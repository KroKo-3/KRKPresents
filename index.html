  <style>
    :root {
      color-scheme: light;
      --bg: #fbfaf7;
      --surface: #ffffff;
      --ink: #34343b;
      --muted: #777782;
      --line: #ece9e5;
      --lavender: #eeeafd;
      --pink: #fbecef;
      --mint: #eaf5ef;
      --accent: #7566a8;
      --shadow: 0 12px 34px rgba(69, 58, 85, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      letter-spacing: .015em;
    }
    .page { width: min(880px, calc(100% - 36px)); margin: 0 auto; padding: 48px 0 36px; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 38px); font-weight: 800; letter-spacing: .04em; line-height: 1.4; }
    .title-mark { width: 54px; height: 4px; margin: 18px auto 0; border-radius: 99px; background: linear-gradient(90deg, #d9d0f3, #f1d5dd, #d4e8dc); }
    .content-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .site-card { display: flex; min-height: 236px; flex-direction: column; padding: 25px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
    .site-card:nth-child(1) .card-icon { background: var(--lavender); }
    .site-card:nth-child(2) .card-icon { background: var(--pink); }
    .card-icon { display: grid; width: 48px; height: 48px; place-items: center; margin-bottom: 19px; border-radius: 15px; color: #70638e; }
    .card-icon svg { width: 25px; height: 25px; }
    h2 { margin: 0 0 9px; font-size: 19px; font-weight: 750; line-height: 1.5; }
    .description { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .open-link { display: flex; min-height: 46px; align-items: center; justify-content: center; gap: 9px; margin-top: auto; border-radius: 12px; background: #f1eef9; color: #65578f; font-size: 14px; font-weight: 700; text-decoration: none; transition: transform .18s ease, background .18s ease; }
    .site-card:nth-child(2) .open-link { background: #f9eef1; color: #986a7a; }
    .open-link:hover { transform: translateY(-2px); background: #e9e3f7; }
    .site-card:nth-child(2) .open-link:hover { background: #f5e3e9; }
    .open-link svg { width: 15px; height: 15px; }
    a.inline-link { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
    footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 12px; }
    footer a { color: #7566a8; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 620px) {
      .page { width: min(460px, calc(100% - 30px)); padding-top: 36px; }
      header { margin-bottom: 24px; }
      .content-list { grid-template-columns: 1fr; gap: 15px; }
      .site-card { min-height: 218px; padding: 22px; }
      footer { margin-top: 28px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
